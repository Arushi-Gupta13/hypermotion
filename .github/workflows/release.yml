name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Avoid concurrent releases for the same tag clobbering each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        env:
          # Ad-hoc signing path: package.json -> build.mac.identity = "-"
          # tells electron-builder to use codesign's ad-hoc identity
          # (free, self-applied, no Apple Developer cert needed). The
          # resulting DMG opens with the friendly "unidentified
          # developer" dialog instead of the harsher "damaged" message.
          # When a real Developer ID cert is wired up, add CSC_LINK +
          # CSC_KEY_PASSWORD secrets and replace identity with the
          # full team name; also re-enable hardenedRuntime.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run build:mac

      - name: Build app (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win

      - name: Package Figma plugin
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          (
            cd figma-plugin
            zip -q -r "../release/hyper-motion-figma-plugin-v${VERSION}.zip" \
              manifest.json dist/code.js dist/ui.html LICENSE NOTICE README.md
          )

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/hyper-motion-figma-plugin-v*.zip
            release/latest-mac.yml
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist-release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist-release/

      - name: List downloaded files
        run: ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.dmg
            dist-release/*.blockmap
            dist-release/*.exe
            dist-release/hyper-motion-figma-plugin-v*.zip
            dist-release/latest-mac.yml
            dist-release/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            See [RELEASES.md](https://github.com/psiddharthdesign/hypermotion/blob/main/RELEASES.md) for the full release notes.

            ## Install on macOS

            v0.1.x ships unsigned, so macOS will block the first open with a
            "damaged" dialog. Two-step setup, then it opens normally forever:

            **1. Download and drag to Applications**

            Pick `hyper-motion-*-arm64.dmg` (Apple Silicon) or `hyper-motion-*.dmg`
            (Intel). Open the DMG, drag **hyper-motion** to **Applications**.

            **2. Open Terminal and run these two lines:**

            ```sh
            xattr -cr /Applications/hyper-motion.app
            codesign --force --deep --sign - /Applications/hyper-motion.app
            ```

            This strips macOS's download quarantine and re-applies an ad-hoc signature
            locally. After this, double-click the app and it opens.

            **Why?** Apple requires paid Developer signing + notarization for downloads
            to skip the warning entirely. Planned for v0.2. If you'd rather skip these
            steps, [build from source](https://github.com/psiddharthdesign/hypermotion#build-from-source)
            — locally-built apps never get the quarantine flag.

            ---

            ## Install on Windows

            Download `hyper-motion Setup *.exe` from this release and run the NSIS
            installer. The research-preview build is unsigned, so SmartScreen may
            warn on first open — choose **More info** then **Run anyway**.

            Pick the x64 installer on Intel/AMD PCs, or the arm64 installer on
            Snapdragon / Windows on Arm.
